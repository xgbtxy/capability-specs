id: ansible-manage-multiple-servers
name: 批量管理多台服务器
purpose: 用 Ansible 统一连接、检查和批量修改多台服务器。
inputs:
  - name: inventory_targets
    type: path_or_text
    description: 主机清单、IP、分组和认证信息
  - name: task_goal
    type: string
    description: 想批量检查、执行还是配置什么
outputs:
  - name: inventory_summary
    type: string
    description: 目标机器和分组摘要
  - name: playbook_result
    type: path_or_text
    description: playbook 或批量执行结果
  - name: validation_notes
    type: string
    description: 哪些机器成功、失败和后续排查方向
tools:
  - name: ansible
  - name: ansible-playbook
  - name: ssh
workflow:
  - step: 确认控制端目标机器和认证方式
  - step: 安装 Ansible 并验证连通
  - step: 编写 inventory 和最小 playbook
  - step: 批量执行命令和配置变更
  - step: 验证执行结果并回看失败机器
constraints:
  - 不允许在没确认 inventory 和认证前就批量执行
  - 不允许对生产机器直接下高风险改动
  - 不允许只看 playbook 返回成功不抽样验证机器状态
